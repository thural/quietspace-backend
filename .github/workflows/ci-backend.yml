name: Backend CI

on:
  push:
    branches: [ "staging", "prod" ]
    paths:
      - 'core/**'
      - 'domain/**'
      - 'app/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '*.gradle.kts'
      - 'Dockerfile'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ "staging", "prod" ]
    paths:
      - 'core/**'
      - 'domain/**'
      - 'app/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '*.gradle.kts'
      - 'Dockerfile'

jobs:

  test-core:
    name: Test Core Modules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run core tests
        run: ./gradlew :core:core-shared:test :core:core-data:test :core:core-web:test :core:core-security:test :core:core-messaging:test

  test-domain:
    name: Test Domain Modules
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run domain tests
        run: ./gradlew :domain:domain-user:test :domain:domain-post:test :domain:domain-photo:test :domain:domain-comment:test :domain:domain-reaction:test :domain:domain-chat:test :domain:domain-message:test :domain:domain-notification:test

  test-app:
    name: Test App Module
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run app integration tests
        run: ./gradlew :app:quietspace-app:test

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    needs: [ test-core, test-domain, test-app ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Project Version
        id: project-version
        run: |
          VERSION=$(grep -oP 'version = "\K[^"]+' build.gradle.kts)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/quietspace-backend:latest
            ghcr.io/${{ github.repository_owner }}/quietspace-backend:${{ steps.project-version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/quietspace-backend:${{ github.sha }}

      - name: Repository Dispatch to Infra Repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_REPO_ACCESS_TOKEN }}
          repository: ${{ github.repository_owner }}/quietspace-infrastructure
          event-type: deploy-backend
          client-payload: |
            {
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref_name }}",
              "version": "${{ steps.project-version.outputs.VERSION }}",
              "image": "ghcr.io/${{ github.repository_owner }}/quietspace-backend:${{ github.sha }}"
            }
